services:
  bigquery-emulator:
    container_name: bigquery
    image: ghcr.io/glassmonkey/bigquery-emulator:v0.1
    ports:
      - "127.0.0.1:9050:9050"
    volumes:
      - '.:/work'
    working_dir: /work
    command: --project=test --data-from-yaml=/work/data.yaml
  app:
    container_name: app
    build: .
    working_dir: /work
    volumes:
      - '.:/work'
