name: build and push image

# Triggered by `v*` tag pushes (which only happen via the bump.yml
# tag job). Builds a multi-arch (linux/amd64 + linux/arm64) image
# from the pure-Go Dockerfile and publishes it to ghcr.io.
#
# Single-runner with QEMU + buildx is the canonical way to push a
# multi-arch manifest from one job. The previous matrix-of-runners
# approach raced on the same tag and only one arch would survive in
# the registry.
on:
  push:
    tags:
      - v*

env:
  REGISTRY: ghcr.io

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            REVISION=${{ steps.meta.outputs.sha }}
