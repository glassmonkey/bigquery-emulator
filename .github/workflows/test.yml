name: build and test
on:
  push:
    branches:
      - main
  pull_request:
    # Only fire on changes that affect the build / test result.
    # Workflow-only or docs-only PRs (e.g. release tooling tweaks)
    # skip the build+test cycle. Use workflow_dispatch as the escape
    # hatch when a forced run is wanted.
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'Dockerfile'
      - 'e2e/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build
    # Keep both runners. The fork is not fully CGO-free yet
    # (mattn/go-sqlite3 is CGO-bound), so libc / system-sqlite
    # differences between Linux and macOS can surface real
    # portability bugs at link/runtime. macOS-only failures are
    # caught here rather than after a release.
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: download modules
        run: go mod download
      - name: build
        run: make emulator/build
        env:
          VERSION: test
      - name: show version
        run: ./bigquery-emulator --version
  test:
    name: Test
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: download modules
        run: go mod download
      - name: test
        run: go test ./... -count=1 -timeout 600s

  e2e:
    name: E2E
    # Container-backed; ubuntu-latest only. Docker on macOS GitHub
    # runners is not first-class (no Docker Desktop license-free
    # setup), so the e2e build/test cycle stays on Linux. The
    # cross-OS portability concern is already covered by the Build
    # matrix above.
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-buildx-action@v3

      # Build the image locally (load: true) so compose can start it
      # without pulling. cache-from/to uses the gha cache so repeat
      # PR runs reuse layers — first run on a cold cache is ~1-2 min,
      # warm-cache runs land around 20-30s.
      - name: build local image for e2e
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: bigquery-emulator:local-test
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=e2e
          cache-to: type=gha,mode=max,scope=e2e

      - name: prepare fixture
        run: make e2e/fixture

      - name: bring up emulator
        run: docker compose -f e2e/compose.yml up -d --no-build

      # Same poll pattern as release.yml: 30s window because a
      # freshly-built image on a cold runner needs more than the
      # local Makefile's 5s budget.
      - name: wait for emulator
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -s -m 2 -o /dev/null http://localhost:9050/; then
              echo "OK: emulator responding on :9050 (attempt ${i})"
              exit 0
            fi
            sleep 1
          done
          echo "FAIL: emulator not reachable on :9050 after 30s" >&2
          docker compose -f e2e/compose.yml logs --tail=100 bigquery-emulator >&2 || true
          exit 1

      - name: run e2e tests
        run: go test -tags=e2e -count=1 -v ./e2e/...

      - name: tear down
        if: always()
        run: docker compose -f e2e/compose.yml down --volumes
