name: Release

# Triggered when version.go advances on main — which only happens
# when bump.yml's release PR (head=release) merges. The branch
# push event with paths=version.go fires reliably for Action-
# driven merges, sidestepping the GITHUB_TOKEN-cannot-trigger-
# downstream-workflows limitation that ruled out the previous
# `on: push: tags` design.
#
# Two jobs, all native (no QEMU anywhere):
#
#   smoke   — matrix over (linux/amd64, linux/arm64) on
#             native GitHub-hosted runners (ubuntu-latest +
#             ubuntu-24.04-arm). Each shard builds its
#             single-arch image, runs the e2e smoke against the
#             actual binary, then pushes the validated image to
#             ghcr.io by digest (no tag yet) so publish can
#             stitch the manifest list. Build + runtime both run
#             native to the target arch — the gate exercises the
#             same artifact we publish, with zero emulation.
#
#   publish — needs: smoke. Downloads each shard's digest, calls
#             `docker buildx imagetools create` to build a
#             multi-arch manifest list pointing at the two
#             already-pushed digests, tags the v* (and v.X.Y)
#             aliases, pushes the v* git tag, and creates the
#             GitHub Release scoped to commits since the
#             previous tag. No image build happens here — the
#             arch-specific images were built natively in smoke.
on:
  push:
    branches: [main]
    paths:
      - 'version.go'

env:
  REGISTRY: ghcr.io

jobs:
  smoke:
    name: smoke (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            digest_artifact: digest-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            digest_artifact: digest-arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # First build: load locally for e2e. `load: true` requires
      # single-platform — this matrix shard's `${{ matrix.platform }}`
      # matches the runner's native arch so no emulation involved.
      - name: build local image for e2e
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          tags: bigquery-emulator:local-test
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: bring up emulator
        run: docker compose -f e2e/compose.yml up -d --no-build

      # Poll :9050 directly (Makefile's docker/healthcheck is local-only —
      # CI needs a wider retry window since a freshly-built image plus
      # cold container start on a runner takes longer than 5s). curl -s
      # (no -f) on purpose: the emulator returns HTTP 500 for `GET /`
      # so any HTTP response counts as healthy; we only need port
      # reachability.
      - name: wait for emulator
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -s -m 2 -o /dev/null http://localhost:9050/; then
              echo "OK: emulator responding on :9050 (attempt ${i})"
              exit 0
            fi
            sleep 1
          done
          echo "FAIL: emulator not reachable on :9050 after 30s" >&2
          docker compose -f e2e/compose.yml logs --tail=100 bigquery-emulator >&2 || true
          exit 1

      - name: run e2e tests
        run: go test -tags=e2e -count=1 -v ./e2e/...

      - name: tear down
        if: always()
        run: docker compose -f e2e/compose.yml down --volumes

      # Second build: push by digest now that e2e validated the
      # artifact. cache-from with the same scope as the first build
      # lets buildx reuse layers — effectively a re-export, not a
      # rebuild. push-by-digest=true means no tag is set on push;
      # publish references the resulting digest via the artifact.
      - name: push image by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.push.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.digest_artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: tag + manifest + GitHub Release
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Read version
        id: version
        run: |
          set -euo pipefail
          v=$(go tool gobump show -r .)
          mm=$(echo "$v" | cut -d. -f1-2)
          {
            echo "tag=v${v}"
            echo "major_minor_tag=v${mm}"
          } >> "$GITHUB_OUTPUT"

      - name: Bail if tag already exists
        id: existing
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3
        if: steps.existing.outputs.skip != 'true'

      - uses: docker/login-action@v3
        if: steps.existing.outputs.skip != 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each digest in /tmp/digests/ is a sha256 hex string (filename
      # is the digest sans the `sha256:` prefix). imagetools create
      # accepts repo@sha256:... source refs and stitches them into a
      # multi-arch manifest list under the supplied -t tags.
      - name: Create manifest list and push
        if: steps.existing.outputs.skip != 'true'
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.version.outputs.tag }} \
            -t ${{ env.REGISTRY }}/${{ github.repository }}:${{ steps.version.outputs.major_minor_tag }} \
            $(printf '${{ env.REGISTRY }}/${{ github.repository }}@sha256:%s ' *)

      - name: Tag and create GitHub Release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          prev=$(git tag --list 'v*' --sort=-v:refname | head -n1 || true)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"

          if [ -n "${prev}" ]; then
            gh release create "${tag}" \
              --title "${tag}" \
              --generate-notes \
              --notes-start-tag "${prev}"
          else
            gh release create "${tag}" \
              --title "${tag}" \
              --generate-notes
          fi
